name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/osconecta-release.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/osconecta-release.jks"
            gradle --no-daemon assembleRelease
            echo "APK_PATH=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "APK_KIND=assinado" >> "$GITHUB_ENV"
          else
            gradle --no-daemon assembleDebug
            echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
            echo "APK_KIND=debug (não serve para atualização entre builds do Actions)" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: OSConecta-apk
          path: ${{ env.APK_PATH }}
      - name: Avisar que o release aguarda assinatura estável
        if: github.ref == 'refs/heads/main' && env.HAS_RELEASE_SIGNING != 'true'
        run: echo "::warning::Release de atualização omitido. Configure os quatro Actions secrets de assinatura para habilitar APKs atualizáveis."
      - name: Publicar release com APK
        if: github.ref == 'refs/heads/main' && env.HAS_RELEASE_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_KIND: ${{ env.APK_KIND }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe; altere a versionName antes de publicar outra versão."
          else
            gh release create "$TAG" "$APK_PATH" \
              --target "$GITHUB_SHA" \
              --title "OS Conecta $TAG" \
              --notes "Atualização automática por consulta às GitHub Releases, com download do APK e confirmação de instalação pelo Android. A assinatura de release é mantida por Actions secrets. Checklist de segurança em campo permanece separado do texto da OS."
          fi


