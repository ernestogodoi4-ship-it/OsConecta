name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OSConecta-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar release com APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG já existe; APK compilado foi publicado como artefato do workflow."
          else
            gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
              --target "$GITHUB_SHA" \
              --title "OS Conecta $TAG" \
              --notes "Checklist de segurança de campo separado do encerramento da OS. Inclui conferências para deslocamento, ambiente, poste/rede elétrica, altura e resgate, caixas subterrâneas e escavações (quando aplicável), risco óptico e fragmentos de fibra, ferramentas, produtos de limpeza e ergonomia. Os registros do checklist permanecem localmente no aparelho e não são copiados, exportados ou incluídos no histórico do texto final. Referências de desenho: NR-01, NR-06, NR-10, NR-17, NR-18, NR-33 e NR-35; aplicabilidade conforme atividade e avaliação de riscos. O site público da Viva Telecom apresenta seus serviços de fibra, sem publicar procedimento interno de segurança. APK debug para instalação e avaliação; distribuição formal requer assinatura da organização."
          fi


